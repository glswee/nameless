name: Build nameless

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            /private/var/tmp/_bazel_runner
            ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-v3
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios

      - name: Build
        run: |
          set -x
          set -o pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_runner"
          cd "$SOURCE_DIR"

          export BUILD_NUMBER="${{ github.run_number }}"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export XCODE_VERSION_OVERRIDE="26.3.0"

          # Step 1: Import certificates into keychain
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Step 2: Fix provisioning profiles
          openssl pkcs12 -in build-system/fake-codesigning/certs/SelfSigned.p12 -passin pass: -nokeys -out /tmp/cert.pem
          openssl pkcs12 -in build-system/fake-codesigning/certs/SelfSigned.p12 -passin pass: -nocerts -nodes -out /tmp/key.pem
          python3 build-system/Make/fix_profiles.py
          rm -f /tmp/cert.pem /tmp/key.pem

          # Step 3: Clean Bazel cache and build
          rm -rf /private/var/tmp/_bazel_runner/*
          # Step 4: Build
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
          2>&1 | tee /tmp/build.log
          echo "=== LAST 100 LINES ===" && tail -100 /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3

      - name: Collect artifacts
        run: |
          set -x
          set -o pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd "$SOURCE_DIR"
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.ipa; do
            if [ -f "$f" ]; then
              cp "$f" "$OUTPUT_PATH/nameless.ipa"
              echo "Found IPA: $f"
            fi
          done
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/SwiftgramWatchApp_dsyms/*.dSYM; do
            if [ -d "$f" ]; then
              cp -R "$f" build/DSYMs/ 2>/dev/null || true
            fi
          done
          if [ -d "build/DSYMs" ] && [ "$(ls -A build/DSYMs)" ]; then
            zip -r "./$OUTPUT_PATH/nameless.DSYMs.zip" build/DSYMs
          fi
          ls -lah "$OUTPUT_PATH/" || echo "No artifacts found"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nameless-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/nameless.ipa
          retention-days: 7

      - name: Upload DSYMs
        uses: actions/upload-artifact@v4
        with:
          name: nameless-dsyms
          path: /Users/Shared/telegram-ios/build/artifacts/nameless.DSYMs.zip
          retention-days: 7
          if-no-files-found: ignore

